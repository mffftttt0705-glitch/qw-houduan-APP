<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QW电竞 API</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    .ok { color: #059669; }
    pre { background: #111; color: #eee; padding: 12px; border-radius: 8px; overflow: auto; font-size: 13px; }
  </style>
</head>
<body>
  <h1>QW电竞 后端 API</h1>
  <p>Cloudflare Pages Functions 已部署。</p>
  <p>健康检查：<a href="/api/health"><code>/api/health</code></a></p>
  <p>App 后端地址填本站域名，例如：</p>
  <pre id="base"></pre>
  <script>
    document.getElementById('base').textContent = location.origin;
    fetch('/api/health').then(r => r.json()).then(d => {
      const p = document.createElement('p');
      p.className = 'ok';
      p.textContent = '状态: ' + JSON.stringify(d);
      document.body.appendChild(p);
    }).catch(e => {
      const p = document.createElement('p');
      p.textContent = '健康检查失败: ' + e;
      document.body.appendChild(p);
    });
  </script>
</body>
</html>
